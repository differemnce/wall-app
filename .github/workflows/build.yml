name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - run: npm install
    - run: npm run build
    - run: npm run dist

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: exe
        path: dist/*.exe
